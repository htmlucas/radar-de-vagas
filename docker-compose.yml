services:
  db:
    image: postgres:16-alpine
    container_name: vagas-laravel-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vagas}
      POSTGRES_USER: ${POSTGRES_USER:-vagas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
